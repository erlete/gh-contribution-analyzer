# Development overrides: local build, every service port published, Mailpit
# for email capture, live reload. Run with:
#   docker compose -f compose.yml -f compose.dev.yml up --build

services:
  caddy:
    ports: !override
      - "8080:80"
    environment:
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-$$2a$$14$$ezyanMBy1h/v3Tss5n5rmeUIG5sjtd3Y3tBjZtEfDD/ELhC7dlbjC}

  app:
    build: .
    image: gh-contribution-analyzer:dev
    command: uvicorn gca.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    ports:
      - "8000:8000"
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:-mr-qnw-SwqyywZTKYwVqY4163BDQIZGpBE1ox7e0eiM=}
      PYTHONPATH: /app/src
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      SMTP_SENDER_ADDRESS: gca-dev@localhost
    volumes:
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro

  worker:
    build: .
    image: gh-contribution-analyzer:dev
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:-mr-qnw-SwqyywZTKYwVqY4163BDQIZGpBE1ox7e0eiM=}
      PYTHONPATH: /app/src
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      SMTP_SENDER_ADDRESS: gca-dev@localhost
    volumes:
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
      - clones:/data/clones
      - reports:/data/reports

  postgres:
    environment:
      POSTGRES_PASSWORD: gca
    ports:
      - "5432:5432"

  mailpit:
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit:/data

volumes:
  mailpit:
