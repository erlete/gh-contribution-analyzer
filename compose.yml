# Production stack. Caddy is the only exposed service.
# Deployable without cloning the repository: download compose.yml,
# deploy/Caddyfile and .env (see .env.example), then `docker compose up -d`.

name: gca

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-root}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started

  app:
    image: ghcr.io/erlete/gh-contribution-analyzer:${GCA_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-gca}:${POSTGRES_PASSWORD:-gca}@postgres:5432/${POSTGRES_DB:-gca}}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - reports:/data/reports
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    image: ghcr.io/erlete/gh-contribution-analyzer:${GCA_TAG:-latest}
    restart: unless-stopped
    command: gca-worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-gca}:${POSTGRES_PASSWORD:-gca}@postgres:5432/${POSTGRES_DB:-gca}}
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - clones:/data/clones
      - reports:/data/reports

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gca}
      POSTGRES_DB: ${POSTGRES_DB:-gca}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-gca} -d $${POSTGRES_DB:-gca}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  caddy-data:
  caddy-config:
  clones:
  reports:
  pgdata:
